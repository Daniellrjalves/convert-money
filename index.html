<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="./scripts.js" defer></script>
</head>

<body>
  <!-- imagem principal-->
  <!-- <img class="logo" src="./assets/logo.gif" alt="logo-convert-money" /> -->

  <!--Sessão principal-->
  <main>
    <header>
      <h1>Convert Money</h1>
    </header>
    <!--Converter de real brasileiro-->
    <label>
      Converter <b> de </b>
      <select>
        <option>R$ Real</option>
      </select>
    </label>

    <!--Converter para Dólar americano / Euro / Libra / Bitcoin-->
    <label>
      Converter <b> para </b>
      <select class="currency-select">
        <option value="dolar">US$ Dólar</option>
        <option value="euro">€ Euro</option>
        <option value="libra">£ Libra</option>
        <option value="btc">₿ Bitcoin</option>
      </select>
    </label>

    <!--Valor que vai ser a possível conversão-->
    <label>
      Valor
      <input class="input-currency" placeholder="Digite aqui" />
    </label>

    <!--Botão de de converter-->
    <button class="convert-button">Converter</button>

    <!--Sessão secundária-->
    <section>
      <!--primeira caixa da sessão secundária onde tem a moeda e valor a ser convertido-->
      <div class="currency-box">
        <img src="./assets/real.png" alt="real-brasileiro" />
        <p class="currency">Real</p>
        <p class="currency-value-to-convert">R$ 0,00</p>
      </div>

      <!--imagem secundária-->
      <img class="arrow-img" src="./assets/arrow.png" alt="seta" />

      <!--segunda caixa da sessão secundária onde tem a moeda e valor convertido-->
      <div class="currency-box">
        <img class="currency-img" src="./assets/dolar.png" alt="dolar-americano" />
        <p class="currency" id="currency-name">Dólar Americano</p>
        <p class="currency-value">US$ 0,00</p>
      </div>
    </section>
  </main>
</body>

</html>
